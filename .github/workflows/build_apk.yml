name: Build APK - CosmoSort

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 'Clean cache before build (ignore saved cache)'
        required: false
        type: boolean
        default: false

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: cosmosort-buildozer-global-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            cosmosort-buildozer-global-v1-${{ runner.os }}-

      - name: Cache .buildozer local directory
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: cosmosort-buildozer-local-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            cosmosort-buildozer-local-v1-${{ runner.os }}-

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmosort-2.0.0-debug
          path: |
            bin/*.apk
            ${{ steps.buildozer.outputs.filename }}
          retention-days: 30

