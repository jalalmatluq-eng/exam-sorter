name: Build APK - Rateb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 'Clean cache before build (ignore saved cache)'
        required: false
        type: boolean
        default: false

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  lint:
    name: Code quality checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: ruff check .

      - name: Check for secrets in code
        run: |
          # فحص استباقي للأسرار ومفاتيح الـ API الحقيقية في الكود المصدري
          if grep -rnE "sk-ant-api[0-9]{2}-[a-zA-Z0-9_\-]{20,}" --include="*.py" --exclude-dir=".git" .; then
            echo "::error::Potential Anthropic API key found in source code!"
            exit 1
          fi

  test:
    name: Run automated unit tests
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          # opencv headless: same API as opencv-python, no system libGL needed on CI runners
          pip install pillow python-dotenv arabic-reshaper python-bidi numpy opencv-python-headless kivy kivymd materialyoucolor asynckivy onnxruntime

      - name: Cache AI model binaries
        uses: actions/cache@v6
        with:
          path: assets/models
          key: cosmosort-models-${{ hashFiles('tools/download_ai_models.py') }}

      - name: Download AI model binaries (required by offline test suites)
        run: |
          python tools/download_ai_models.py

      - name: Run test_modules.py (21 suites including SAF, UI category details, & SD card simulation)
        env:
          KIVY_NO_ARGS: "1"
        run: |
          python test_modules.py

  build-apk:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev ccache

      - name: Install Buildozer and tools
        run: |
          pip install --upgrade pip
          pip install --upgrade "Cython<3.0" buildozer virtualenv sh jinja2

      - name: Cache Buildozer global directory (~/.buildozer)
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache@v6
        with:
          path: ~/.buildozer
          key: cosmosort-global-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            cosmosort-global-v2-${{ runner.os }}-

      - name: Cache .buildozer local directory
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache@v6
        with:
          path: .buildozer
          key: cosmosort-local-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            cosmosort-local-v2-${{ runner.os }}-

      - name: Cache AI model binaries
        uses: actions/cache@v6
        with:
          path: assets/models
          key: cosmosort-models-${{ hashFiles('tools/download_ai_models.py') }}

      - name: Download AI model binaries
        run: |
          python tools/download_ai_models.py
          python -c "from pathlib import Path; files=[Path('assets/models/ocr/ara.traineddata'),Path('assets/models/ocr/arabic_rec.onnx'),Path('assets/models/ocr/arabic_dict.txt'),Path('assets/models/face/mobilefacenet.onnx'),Path('assets/models/video/mobilenetv2_video.onnx')]; missing=[str(f) for f in files if not f.exists() or f.stat().st_size<=1000]; assert not missing, f'Missing model files: {missing}'; print('All 5 model files verified OK')"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rateb-2.0.1-debug
          path: bin/*.apk
          retention-days: 30
