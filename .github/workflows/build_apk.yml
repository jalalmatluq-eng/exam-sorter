name: Build APK - Wasaet Dhakiyah

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python 3.10 - fully compatible with buildozer 1.5.0 and Cython 0.29.x
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ALL system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip curl wget \
            openjdk-17-jdk \
            autoconf automake autopoint gettext \
            libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential \
            ccache python3-dev \
            libjpeg-dev libpng-dev \
            lld python3-pip python3-venv
          java -version
          python3 --version
          pip3 --version

      - name: Cache .buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-v6-py310-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v6-py310-${{ runner.os }}-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v6-py310-${{ runner.os }}
          restore-keys: pip-v6-py310-

      - name: Install Buildozer, Cython and dependencies
        run: |
          pip install --upgrade pip wheel setuptools
          pip install cython==0.29.37
          pip install buildozer==1.5.0
          pip install virtualenv
          echo "=== Versions ==="
          buildozer version
          cython --version
          python --version

      - name: Verify project structure
        run: |
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo ""
          echo "=== Key source files ==="
          ls -la *.py
          ls -la assets/

      - name: Build debug APK
        run: |
          set -o pipefail
          yes "" | buildozer -v android debug 2>&1 | tee build.log

      - name: Show build result
        if: always()
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -100 build.log 2>/dev/null || echo "No build.log"
          echo ""
          echo "=== APK FILES ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasaet-dhakiyah-v2-debug
          path: |
            bin/*.apk
            build.log
          retention-days: 30
