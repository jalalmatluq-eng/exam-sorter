name: Build APK - CosmoSort

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 'Clean cache before build (ignore saved cache)'
        required: false
        type: boolean
        default: false

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  test:
    name: Run automated unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          # opencv headless: same API as opencv-python, no system libGL needed on CI runners
          pip install pillow python-dotenv arabic-reshaper python-bidi numpy opencv-python-headless kivy kivymd

      - name: Run test_modules.py (12 suites including SAF, app-private storage, & SD card simulation)
        run: |
          python test_modules.py

  build-apk:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev ccache

      - name: Install Buildozer and tools
        run: |
          pip install --upgrade pip
          pip install --upgrade "Cython<3.0" buildozer virtualenv sh jinja2

      - name: Cache Buildozer global directory (~/.buildozer)
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: cosmosort-global-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            cosmosort-global-v2-${{ runner.os }}-

      - name: Cache .buildozer local directory
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: cosmosort-local-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            cosmosort-local-v2-${{ runner.os }}-

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rateb-2.0.1-debug
          path: bin/*.apk
          retention-days: 30
